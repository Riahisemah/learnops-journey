version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: didacticiel_db
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: devops_password
      POSTGRES_DB: didacticiel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: didacticiel_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://devops_user:devops_password@db:5432/didacticiel_db
      SECRET_KEY: super-secret-key-change-in-production-min-32-characters
      FRONTEND_URL: http://localhost:5173
      DEBUG: "True"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
